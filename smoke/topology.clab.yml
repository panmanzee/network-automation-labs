---
name: smoke
mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.30.30.0/24
topology:
  nodes:
    frr1:
      kind: linux
      image: frr-lab:local
      mgmt-ipv4: 172.30.30.11
      memory: 256M
      binds:
        - configs/bootstrap/frr1.conf:/etc/frr/frr.conf
    frr2:
      kind: linux
      image: frr-lab:local
      mgmt-ipv4: 172.30.30.12
      memory: 256M
      binds:
        - configs/bootstrap/frr2.conf:/etc/frr/frr.conf
  links:
    - endpoints: ["frr1:eth1", "frr2:eth1"]
