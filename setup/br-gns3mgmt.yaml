# Host-only management bridge for GNS3 lab devices. Not bridged to eno1.
#
# Install:  sudo install -m 600 br-gns3mgmt.yaml /etc/netplan/99-br-gns3mgmt.yaml
# Apply:    sudo netplan try         <-- NEVER `netplan apply` on this SSH-only host
#           (auto-rolls-back after 120s; press ENTER only once SSH still works)
#
# `netplan try` can still briefly bounce systemd-networkd and cause eno1 to
# re-DHCP to a different address. Set a DHCP reservation for this host's MAC on
# the router FIRST so the SSH IP cannot move.
network:
  version: 2
  bridges:
    br-gns3mgmt:
      dhcp4: false
      dhcp6: false
      addresses: [10.10.10.1/24]
      parameters:
        stp: false
        forward-delay: 0
