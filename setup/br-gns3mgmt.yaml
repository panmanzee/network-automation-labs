# Copy to /etc/netplan/99-br-gns3mgmt.yaml  (chmod 600), then: sudo netplan apply
# Host-only management bridge for GNS3 lab devices. Not bridged to eno1.
network:
  version: 2
  bridges:
    br-gns3mgmt:
      dhcp4: false
      dhcp6: false
      addresses: [10.10.10.1/24]
      parameters:
        stp: false
        forward-delay: 0
