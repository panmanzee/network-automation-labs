---
# Reference block. Every labs/*/inventory.yml and smoke/inventory.yml copies
# these keys verbatim under `all: vars:`. Auth is SSH public key only
# (ansible/.ssh/id_ed25519, set by ansible.cfg's private_key_file) — FRR nodes
# have no password and vtysh is already privileged for the login user, so there
# is no vault and no become layer.
all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: frr.frr.frr
    ansible_user: automation
    ansible_python_interpreter: auto_silent
