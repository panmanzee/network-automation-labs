---
- name: Smoke test — reach every device and read its version
  hosts: routers
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../ansible/vault.yml"
  tasks:
    - name: Show version
      cisco.ios.ios_command:
        commands: show version
      register: ver

    - name: Assert IOS responded
      ansible.builtin.assert:
        that: "ver.stdout[0] is search('Cisco IOS')"
        fail_msg: "{{ inventory_hostname }} did not return a version banner"
        success_msg: "{{ inventory_hostname }} OK"
